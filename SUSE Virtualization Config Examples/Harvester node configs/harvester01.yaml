scheme_version: 1
token: mylab
os:
  ssh_authorized_keys:
    - ssh-rsa 
    - ssh-rsa 
  hostname: harvester01
  modules:
    - kvm
    - nvme
  sysctls:
    kernel.printk: "4 4 1 7"
    kernel.kptr_restrict: "1"
  dns_nameservers:
    - 10.0.0.94
  ntp_servers:
    - 0.suse.pool.ntp.org
    - 1.suse.pool.ntp.org
  password: rancher
install:
  mode: create
  management_interface:
    interfaces:
    - name: eno1
    - name: eno2
    method: static
    ip: 192.168.50.211
    subnet_mask: 255.255.255.0
    gateway: 192.168.50.1
    bond_options:
      mode: 802.3ad
      miimon: 100
    mtu: 9000
  force_efi: true
  device: /dev/sda
  data_disk: /dev/sdb
  silent: false
  skipchecks: true
  no_format: false
  debug: true
  vip: 192.168.50.201
  vip_mode: static
  wipe_disks: true
  force_mbr: false
